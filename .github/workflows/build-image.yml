name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image to tarball
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/custom-ffmpeg.Dockerfile
          platforms: linux/amd64
          tags: mediamtx-custom:latest-ffmpeg
          outputs: type=docker,dest=mediamtx-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: mediamtx-image.tar
          target: /tmp/

      - name: Load image and restart container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            docker load -i /tmp/mediamtx-image.tar
            rm -f /tmp/mediamtx-image.tar
            cd /home/ubuntu/mediamtx
            docker compose up -d mediamtx
            docker image prune -f
