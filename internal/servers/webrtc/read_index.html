<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<style>
html, body {
	margin: 0;
	padding: 0;
	height: 100%;
	font-family: 'Arial', sans-serif;
}
#video {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background: rgb(30, 30, 30);
}
#message {
	position: absolute;
	left: 0;
	top: 0;
	width: 100%;
	height: 100%;
	display: flex;
	align-items: center;
	text-align: center;
	justify-content: center;
	font-size: clamp(12px, 5vmin, 28px);
	font-weight: bold;
	color: white;
	pointer-events: none;
	padding: 5vmin;
	box-sizing: border-box;
	text-shadow: 0 0 5px black;
}
#loader {
	display: none;
	position: absolute;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%);
	flex-direction: column;
	align-items: center;
	gap: clamp(8px, 3vmin, 20px);
	pointer-events: none;
}
#loader .spinner {
	width: clamp(20px, 18vmin, 60px);
	height: clamp(20px, 18vmin, 60px);
	border: clamp(2px, 1.8vmin, 6px) solid rgba(255, 255, 255, 0.25);
	border-top-color: #fff;
	border-radius: 50%;
	animation: spin 1s linear infinite;
}
#loader .loader-text {
	font-size: clamp(11px, 10vmin, 33px);
	font-weight: bold;
	color: #fff;
	text-shadow: 0 0 5px black;
	white-space: nowrap;
}
@keyframes spin {
	to { transform: rotate(360deg); }
}
</style>
<script defer src="./reader.js"></script>
</head>
<body>

<video id="video"></video>
<div id="message"></div>
<div id="loader"><div class="spinner"></div><div class="loader-text">読込中</div></div>

<script>

const video = document.getElementById('video');
const message = document.getElementById('message');
const loader = document.getElementById('loader');
let defaultControls = false;
let reader = null;

const setLoading = (on) => {
  loader.style.display = on ? 'flex' : 'none';
};

const setMessage = (str) => {
  if (str !== '') {
    video.controls = false;
  } else {
    video.controls = defaultControls;
  }
  message.innerText = str;
};

const parseBoolString = (str, defaultVal) => {
  str = (str || '');

  if (['1', 'yes', 'true'].includes(str.toLowerCase())) {
    return true;
  }
  if (['0', 'no', 'false'].includes(str.toLowerCase())) {
    return false;
  }
  return defaultVal;
};

const loadAttributesFromQuery = () => {
  const params = new URLSearchParams(window.location.search);
  video.controls = parseBoolString(params.get('controls'), true);
  video.muted = parseBoolString(params.get('muted'), true);
  video.autoplay = parseBoolString(params.get('autoplay'), true);
  video.playsInline = parseBoolString(params.get('playsinline'), true);
  video.disablepictureinpicture = parseBoolString(params.get('disablepictureinpicture'), false);
  defaultControls = video.controls;
};

window.addEventListener('load', () => {
  loadAttributesFromQuery();

  reader = new MediaMTXWebRTCReader({
    url: new URL('whep', window.location.href) + window.location.search,
    onError: (err) => {
      if (/stream not found/i.test(err)) {
        setMessage('');
        setLoading(true);
      } else {
        setLoading(false);
        setMessage(err);
      }
    },
    onTrack: (evt) => {
      setLoading(false);
      setMessage('');
      video.srcObject = evt.streams[0];
    },
    onDataChannel: (evt) => {
      evt.channel.binaryType = 'arraybuffer';
      evt.channel.onmessage = (evt) => {
        console.log('data channel message', evt.data);
      };
    },
  });
});

window.addEventListener('beforeunload', () => {
  if (reader !== null) {
    reader.close();
  }
});

</script>

</body>
</html>
